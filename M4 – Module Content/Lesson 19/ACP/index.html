<!DOCTYPE html>
<html>

<head>
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2f8;
            text-align: center;
            padding: 40px;
        }

        .calculator {
            background: white;
            width: 320px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }

        button {
            padding: 10px 14px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #0d6efd;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #084298;
        }

        #result {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Simple Calculator</h2>

        <input type="number" id="num1" placeholder="Enter first number">

        <input type="number" id="num2" placeholder="Enter second number">

        <br>

        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">-</button>
        <button onclick="calculate('*')">×</button>
        <button onclick="calculate('/')">÷</button>

        <h3>Result:</h3>

        <p id="result">0</p>

    </div>

    <script>

        function calculate(operator) {

            let number1 = document.getElementById("num1").value;
            let number2 = document.getElementById("num2").value;

            // Check empty inputs
            if (number1 === "" || number2 === "") {
                document.getElementById("result").innerHTML =
                    "Please enter both numbers";
                return;
            }

            let a = Number(number1);
            let b = Number(number2);
            let answer;

            // Perform calculation

            if (operator === '+') {
                answer = a + b;
            }

            else if (operator === '-') {
                answer = a - b;
            }

            else if (operator === '*') {
                answer = a * b;
            }

            else if (operator === '/') {

                if (b === 0) {
                    document.getElementById("result").innerHTML =
                        "Cannot divide by zero";
                    return;
                }

                answer = a / b;
            }

            // Display result
            document.getElementById("result").innerHTML =
                answer;

        }

    </script>

</body>

</html>
