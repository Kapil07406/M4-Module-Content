<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Statements</title>
</head>

<body>

    <h1>Student Result</h1>

    <script>
        // Declare variables

        let english = 80;
        let maths = 90;
        let science = 85;

        // Calculate total marks

        let total = english + maths + science;

        // Calculate average

        let average = total / 3;

        // Display results

        console.log("English Marks: " + english);
        console.log("Maths Marks: " + maths);
        console.log("Science Marks: " + science);

        console.log("Total Marks: " + total);
        console.log("Average Marks: " + average);
    </script>

</body>

</html>
