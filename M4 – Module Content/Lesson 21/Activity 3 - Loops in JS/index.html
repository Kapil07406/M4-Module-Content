<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Loops</title>
</head>

<body>

    <h1>JavaScript Loops</h1>

    <script>

        // 1. For Loop

        console.log("For Loop:");

        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }

        // 2. While Loop

        console.log("While Loop:");

        let j = 1;

        while (j <= 5) {
            console.log(j);
            j++;
        }

        // 3. Do While Loop

        console.log("Do While Loop:");

        let k = 1;

        do {
            console.log(k);
            k++;
        } while (k <= 5);

    </script>

</body>

</html>
