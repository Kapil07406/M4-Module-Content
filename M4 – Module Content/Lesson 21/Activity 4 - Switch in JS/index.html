<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Switch</title>
</head>

<body>

    <h1>Day Finder</h1>

    <label>Enter Day Number (1-7):</label>

    <input type="number" id="day">

    <button onclick="findDay()">Check Day</button>

    <h3 id="result"></h3>

    <script>

        function findDay() {

            let day = Number(
                document.getElementById("day").value
            );

            let message;

            switch (day) {

                case 1:
                    message = "Monday";
                    break;

                case 2:
                    message = "Tuesday";
                    break;

                case 3:
                    message = "Wednesday";
                    break;

                case 4:
                    message = "Thursday";
                    break;

                case 5:
                    message = "Friday";
                    break;

                case 6:
                    message = "Saturday";
                    break;

                case 7:
                    message = "Sunday";
                    break;

                default:
                    message = "Invalid Day Number";
            }

            document.getElementById("result").innerHTML =
                message;

        }

    </script>

</body>

</html>
