<!DOCTYPE html>
<html>

<head>
    <title>Sum of Arguments</title>

    <style>
        body {
            font-family: Arial;
            background: #eaf2f8;
            text-align: center;
            padding: 40px;
        }

        .calculator {
            background: white;
            max-width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }

        button {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .clear {
            background: #dc3545;
        }

        #result {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Sum of Arguments</h2>

        <input type="number" id="num1" placeholder="Enter first number">

        <input type="number" id="num2" placeholder="Enter second number">

        <input type="number" id="num3" placeholder="Enter third number">

        <input type="number" id="num4" placeholder="Enter fourth number">

        <br>

        <button onclick="calculateSum()">
            Calculate Sum
        </button>

        <button class="clear" onclick="clearData()">
            Clear
        </button>

        <h3>Result:</h3>

        <p id="result">0</p>

    </div>

    <script>

        // Function using arguments object

        function sumArguments() {

            let total = 0;

            // Loop through all arguments

            for (let i = 0; i < arguments.length; i++) {

                total += arguments[i];

            }

            return total;

        }

        // Get input values

        function calculateSum() {

            let inputs = [
                document.getElementById("num1").value,
                document.getElementById("num2").value,
                document.getElementById("num3").value,
                document.getElementById("num4").value
            ];

            // Check empty inputs

            if (inputs.some(value => value === "")) {

                document.getElementById("result").innerHTML =
                    "Please enter all numbers";

                return;
            }

            // Convert inputs into numbers

            let a = Number(inputs[0]);
            let b = Number(inputs[1]);
            let c = Number(inputs[2]);
            let d = Number(inputs[3]);

            // Pass values as arguments

            let answer = sumArguments(a, b, c, d);

            // Display result

            document.getElementById("result").innerHTML =
                answer;

        }

        // Clear inputs

        function clearData() {

            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("num3").value = "";
            document.getElementById("num4").value = "";

            document.getElementById("result").innerHTML = "0";

        }

    </script>

</body>

</html>
