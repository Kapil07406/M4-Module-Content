<!DOCTYPE html>
<html>

<head>
    <title>Multiplication Using Functions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2f8;
            text-align: center;
            padding: 40px;
        }

        .calculator {
            background: white;
            width: 320px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .clear {
            background: #dc3545;
        }

        #result {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Multiplication Program</h2>

        <input type="number" id="num1" placeholder="Enter first number">

        <input type="number" id="num2" placeholder="Enter second number">

        <br>

        <button onclick="multiply()">
            Multiply
        </button>

        <button class="clear" onclick="clearResult()">
            Clear
        </button>

        <h3>Result:</h3>

        <p id="result">0</p>

    </div>

    <script>

        // Multiplication function

        function multiply() {

            let number1 = document.getElementById("num1").value;
            let number2 = document.getElementById("num2").value;

            if (number1 === "" || number2 === "") {
                document.getElementById("result").innerHTML =
                    "Please enter both numbers";
                return;
            }

            let a = Number(number1);
            let b = Number(number2);

            let answer = a * b;

            document.getElementById("result").innerHTML =
                answer;

        }

        // Clear function

        function clearResult() {

            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";

            document.getElementById("result").innerHTML = "0";

        }

    </script>

</body>

</html>
