<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Functions</title>
</head>

<body>

    <h1>Introduction to Functions</h1>

    <button onclick="welcomeMessage()">
        Click Me
    </button>

    <p id="output"></p>

    <script>

        // Create a function

        function welcomeMessage() {

            document.getElementById("output").innerHTML =
                "Welcome to JavaScript Functions!";

        }

    </script>

</body>

</html>
