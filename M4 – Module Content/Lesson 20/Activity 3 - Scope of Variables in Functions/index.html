<!DOCTYPE html>
<html>

<head>
    <title>Variable Scope</title>
</head>

<body>

    <h1>Global and Local Variables</h1>

    <button onclick="showDetails()">
        Show Student Details
    </button>

    <p id="output"></p>

    <script>

        // Global variable

        let schoolName = "ABC Public School";

        function showDetails() {

            // Local variable

            let studentName = "Rahul";
            let age = 15;

            document.getElementById("output").innerHTML =
                "School: " + schoolName +
                "<br>Student: " + studentName +
                "<br>Age: " + age;

        }

    </script>

</body>

</html>
